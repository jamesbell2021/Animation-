# Tests Car Carnage: Belfast Edition and packages it for itch.io whenever it changes, and
# (optionally) pushes the packages to itch.io.
#
# The engine test runs the rules headlessly with bots on every arena. The run's Artifacts hold
# car-carnage-belfast-html5 (the browser game, index.html at the root of the zip, as itch.io
# requires) and car-carnage-belfast-server (the online game server with start scripts).
#
# Secret (Settings -> Secrets and variables -> Actions):
#   BUTLER_API_KEY   itch.io API key (itch.io -> Settings -> API keys). When set, the
#                    "Push to itch.io" job uploads both zips to the itch.io project below.
name: Car Carnage Belfast

on:
  push:
    branches:
      - "**"
    paths:
      - "car-carnage-belfast/**"
      - ".github/workflows/car-carnage-belfast.yml"
    tags:
      - "ccb-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the builds to itch.io (needs the BUTLER_API_KEY secret)"
        type: boolean
        default: false

env:
  ITCH_PROJECT: gamesdevnisite/car-carnage-belfast

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-carnage-belfast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine test (bots on every arena)
        run: npm test
      - name: Package for itch.io
        run: tools/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: car-carnage-belfast-html5
          path: car-carnage-belfast/dist/car-carnage-belfast-html5.zip
      - uses: actions/upload-artifact@v4
        with:
          name: car-carnage-belfast-server
          path: car-carnage-belfast/dist/car-carnage-belfast-server.zip

  # Uploads the packages to itch.io: the browser game to the "html5" channel and the server to
  # the "server" channel. Runs only when asked: a tag like ccb-v1.0.0, or "Run workflow" with
  # "Push the builds to itch.io" ticked.
  itch:
    needs: test-and-package
    if: startsWith(github.ref, 'refs/tags/ccb-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - name: Skip without an itch.io key
        if: env.BUTLER_API_KEY == ''
        run: echo "BUTLER_API_KEY not set; packages are in this run's artifacts only"

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          path: dist

      - name: Install butler
        if: env.BUTLER_API_KEY != ''
        run: |
          wget -q -O butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - uses: actions/checkout@v4
        if: env.BUTLER_API_KEY != ''
        with:
          sparse-checkout: car-carnage-belfast/package.json
          sparse-checkout-cone-mode: false
          path: src

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          version=$(node -p "require('./src/car-carnage-belfast/package.json').version")
          ./butler push dist/car-carnage-belfast-html5/car-carnage-belfast-html5.zip "$ITCH_PROJECT:html5" --userversion "${version:-dev}"
          ./butler push dist/car-carnage-belfast-server/car-carnage-belfast-server.zip "$ITCH_PROJECT:server" --userversion "${version:-dev}"
