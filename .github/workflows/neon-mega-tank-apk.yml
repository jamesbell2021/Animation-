# Builds the Neon Mega Tank Android APK whenever the game changes.
# Download it from the run's "Artifacts" section (Actions tab -> latest run -> neon-mega-tank-apk).
name: Neon Mega Tank APK

on:
  push:
    paths:
      - "neon-mega-tank/**"
      - ".github/workflows/neon-mega-tank-apk.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and the Android export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            "templates/android_debug.apk" "templates/android_release.apk" \
            "templates/android_source.zip" "templates/version.txt" -d "$templates"

      # Sign with the keystore from the ANDROID_DEBUG_KEYSTORE_BASE64 secret if you add one
      # (keeps the signature stable so new builds install over old ones); otherwise make a
      # throwaway debug key for this run.
      - name: Configure the Android SDK and signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export the APK
        working-directory: neon-mega-tank
        run: |
          mkdir -p build
          ../godot --headless --import --path . || true
          ../godot --headless --path . --export-debug "Android" build/neon-mega-tank.apk
          test -s build/neon-mega-tank.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neon-mega-tank-apk
          path: neon-mega-tank/build/neon-mega-tank.apk
