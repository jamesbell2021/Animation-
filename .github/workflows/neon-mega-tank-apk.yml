# Builds Neon Mega Tank for Android, Windows and Linux whenever the game changes, and
# (optionally) pushes the builds to itch.io.
#
# Download builds from the run's "Artifacts" section (Actions tab -> latest run).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_RELEASE_KEYSTORE_BASE64  the release keystore, base64-encoded
#   ANDROID_RELEASE_KEYSTORE_USER    its key alias (neonmegatank)
#   ANDROID_RELEASE_KEYSTORE_PASS    its password
#       With all three set, the APK is a release build signed with that key, so each new
#       build installs over the previous one. Without them it is a debug build with a
#       throwaway key (fine for testing, must be uninstalled before the next build).
#   ANDROID_DEBUG_KEYSTORE_BASE64    optional stable debug key (alias androiddebugkey, pass android)
#   BUTLER_API_KEY                   itch.io API key (itch.io -> Settings -> API keys). When set,
#       the "Push to itch.io" job uploads every build to the itch.io project below.
name: Neon Mega Tank builds

on:
  push:
    # Branches must be listed alongside tags: with tags alone, a push to a branch never builds.
    branches:
      - "**"
    paths:
      - "neon-mega-tank/**"
      - ".github/workflows/neon-mega-tank-apk.yml"
    tags:
      - "nmt-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the builds to itch.io (needs the BUTLER_API_KEY secret)"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.3"
  ITCH_PROJECT: gamesdevnisite/neon-mega-tank

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot and the export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            "templates/android_debug.apk" "templates/android_release.apk" \
            "templates/android_source.zip" "templates/version.txt" \
            "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" \
            "templates/linux_release.x86_64" "templates/linux_debug.x86_64" -d "$templates"
          rm "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      # rcedit (through wine) stamps the game's icon and version into the Windows .exe.
      # On Ubuntu 24.04 the wine64 package has no /usr/bin/wine64; the wine package's
      # /usr/bin/wine launcher runs it. The prefix is made here so the export doesn't wait on it.
      - name: Install wine and rcedit for the Windows icon
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine64 > /dev/null
          wget -q https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -O "$RUNNER_TEMP/rcedit-x64.exe"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"
          echo "WINEDLLOVERRIDES=mscoree,mshtml=" >> "$GITHUB_ENV"
          WINEDEBUG=-all WINEDLLOVERRIDES="mscoree,mshtml=" wineboot --init || echo "::warning::wineboot exited $?"
          wine "$RUNNER_TEMP/rcedit-x64.exe" --help | head -3

      - name: Configure signing keys and editor settings
        env:
          RELEASE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          RELEASE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASS }}
          DEBUG_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_B64" ]; then
            echo "$DEBUG_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$RELEASE_B64" ] && [ -n "$RELEASE_USER" ] && [ -n "$RELEASE_PASS" ]; then
            echo "$RELEASE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_USER" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_MODE=release" >> "$GITHUB_ENV"
            echo "Android: release build, signed with the release key"
          else
            echo "ANDROID_MODE=debug" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_RELEASE_KEYSTORE_* secrets: building a debug APK with a throwaway key"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/windows/rcedit = "$RUNNER_TEMP/rcedit-x64.exe"
          export/windows/wine = "/usr/bin/wine"
          EOF

      - name: Export all platforms
        working-directory: neon-mega-tank
        run: |
          mkdir -p build/windows build/linux
          ../godot --headless --import --path . || true
          ../godot --headless --path . --export-$ANDROID_MODE "Android" build/neon-mega-tank.apk
          ../godot --headless --path . --export-release "Windows Desktop" build/windows/NeonMegaTank.exe
          ../godot --headless --path . --export-release "Linux" build/linux/NeonMegaTank.x86_64
          test -s build/neon-mega-tank.apk
          test -s build/windows/NeonMegaTank.exe
          test -s build/linux/NeonMegaTank.x86_64
          # rcedit only warns when it fails, which leaves Godot's icon on the exe: fail loudly instead.
          python3 -c "import sys; d = open(sys.argv[1], 'rb').read(); sys.exit(0 if 'Neon Mega Tank'.encode('utf-16-le') in d else 'The Windows exe has no Neon Mega Tank icon or version info: rcedit did not run')" build/windows/NeonMegaTank.exe
          cp README.md build/windows/README.md
          cp README.md build/linux/README.md
          (cd build/windows && zip -q -r ../neon-mega-tank-windows.zip .)
          (cd build/linux && zip -q -r ../neon-mega-tank-linux.zip .)
          ls -la build

      - name: Check the Linux build starts
        working-directory: neon-mega-tank
        run: timeout 120 build/linux/NeonMegaTank.x86_64 --headless --quit-after 60

      - uses: actions/upload-artifact@v4
        with:
          name: neon-mega-tank-apk
          path: neon-mega-tank/build/neon-mega-tank.apk
      - uses: actions/upload-artifact@v4
        with:
          name: neon-mega-tank-windows
          path: neon-mega-tank/build/neon-mega-tank-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neon-mega-tank-linux
          path: neon-mega-tank/build/neon-mega-tank-linux.zip

  # Uploads the builds to itch.io. Each platform goes to its own channel, which itch.io shows
  # as separate downloads. Runs only when asked: a tag like nmt-v1.0.0, or "Run workflow" with
  # "Push the builds to itch.io" ticked. The Android upload is skipped for debug builds.
  itch:
    needs: build
    if: startsWith(github.ref, 'refs/tags/nmt-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - name: Skip without an itch.io key
        if: env.BUTLER_API_KEY == ''
        run: echo "BUTLER_API_KEY not set; builds are in this run's artifacts only"

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          path: dist

      - name: Install butler
        if: env.BUTLER_API_KEY != ''
        run: |
          wget -q -O butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - uses: actions/checkout@v4
        if: env.BUTLER_API_KEY != ''
        with:
          sparse-checkout: neon-mega-tank/export_presets.cfg
          sparse-checkout-cone-mode: false
          path: src

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        env:
          RELEASE_SIGNED: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(grep -o 'version/name="[^"]*"' src/neon-mega-tank/export_presets.cfg | head -1 | cut -d'"' -f2)
          ./butler push dist/neon-mega-tank-windows/neon-mega-tank-windows.zip "$ITCH_PROJECT:windows" --userversion "${version:-dev}"
          ./butler push dist/neon-mega-tank-linux/neon-mega-tank-linux.zip "$ITCH_PROJECT:linux" --userversion "${version:-dev}"
          if [ "$RELEASE_SIGNED" = "true" ]; then
            ./butler push dist/neon-mega-tank-apk/neon-mega-tank.apk "$ITCH_PROJECT:android" --userversion "${version:-dev}"
          else
            echo "::warning::Android APK not pushed: it is a debug build (add the ANDROID_RELEASE_KEYSTORE_* secrets)"
          fi
