<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Tripod Attack! A Vectrex-style vector arcade game. Shoot the legs of the Martian fighting-machines, duck the Heat-Ray, protect the people, and take Europe back.">
<title>Tripod Attack!</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #bezel  { position: absolute; inset: 0; pointer-events: none;
            box-shadow: inset 0 0 140px 30px #000, inset 0 0 20px 4px rgba(0,0,0,.6); }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="bezel"></div>
<script src="js/vecfont.js"></script>
<script src="js/audio.js"></script>
<script src="js/wells.js"></script>
<script src="js/map.js"></script>
<script src="js/landmarks.js"></script>
<script src="js/physics.js"></script>
<script src="js/game.js"></script>
</body>
</html>
